<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Hussain — building for the web</title>
  <desc id="desc">An animated developer banner with a glowing code editor, terminal window, and web development introduction.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d1a"/><stop offset="1" stop-color="#15132c"/></linearGradient>
    <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#76e4c3"/><stop offset=".55" stop-color="#6dbbff"/><stop offset="1" stop-color="#bb9bff"/></linearGradient>
    <linearGradient id="shine" x1="0" x2="1"><stop stop-color="#76e4c3" stop-opacity="0"/><stop offset=".5" stop-color="#76e4c3" stop-opacity=".16"/><stop offset="1" stop-color="#76e4c3" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#9db3ff" stroke-opacity=".055"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <clipPath id="screen"><rect x="610" y="74" width="530" height="286" rx="15"/></clipPath>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif}.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
      .float{animation:float 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}.pulse{animation:pulse 3s ease-in-out infinite}.blink{animation:blink 1.1s steps(2,start) infinite}.scan{animation:scan 5s linear infinite}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}@keyframes pulse{0%,100%{opacity:.45}50%{opacity:.9}}@keyframes blink{to{opacity:0}}@keyframes scan{0%{transform:translateY(-170px)}100%{transform:translateY(260px)}}
      @media(prefers-reduced-motion:reduce){.float,.pulse,.blink,.scan{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="420" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="26" fill="url(#grid)"/>
  <circle cx="175" cy="80" r="120" fill="#4b7fff" opacity=".14" filter="url(#glow)" class="pulse"/>
  <circle cx="1090" cy="370" r="140" fill="#60e0bf" opacity=".10" filter="url(#glow)" class="pulse"/>
  <rect x="1" y="1" width="1198" height="418" rx="25" fill="none" stroke="#a6b5ff" stroke-opacity=".18"/>
  <g class="sans">
    <text x="68" y="82" fill="#8fa0ba" font-size="14" font-weight="700" letter-spacing="3">CS STUDENT · WEB DEVELOPER</text>
    <text x="64" y="162" fill="#f5f7ff" font-size="64" font-weight="800" letter-spacing="-2">HUSSAIN</text>
    <rect x="67" y="183" width="270" height="4" rx="2" fill="url(#accent)"/>
    <text x="68" y="232" fill="#c7d1e4" font-size="23" font-weight="500">Building useful things for the web.</text>
    <text x="68" y="273" fill="#94a3bb" font-size="16">WordPress · JavaScript · React · Node.js</text>
    <g transform="translate(68 316)"><circle cx="7" cy="7" r="5" fill="#72e2bf" class="pulse"/><text x="24" y="12" fill="#b7c6dd" font-size="14" letter-spacing="1.4">LEARNING IN PUBLIC</text></g>
    <g class="float"><rect x="610" y="74" width="530" height="286" rx="15" fill="#0b1220" stroke="#8497bc" stroke-opacity=".42"/>
      <path d="M611 89a15 15 0 0 1 15-15h500a15 15 0 0 1 15 15v32H611z" fill="#151e30"/>
      <circle cx="635" cy="98" r="5" fill="#ff777f"/><circle cx="653" cy="98" r="5" fill="#ffc66d"/><circle cx="671" cy="98" r="5" fill="#69ddaa"/>
      <text x="875" y="103" text-anchor="middle" fill="#8492aa" font-size="12" class="mono">hussain.js — editor</text>
      <g clip-path="url(#screen)">
        <rect x="612" y="190" width="526" height="17" fill="#70dfba" opacity=".055"/>
        <rect x="612" y="155" width="526" height="1" fill="url(#shine)" class="scan"/>
        <g class="mono" font-size="15">
          <g fill="#68778e" text-anchor="end"><text x="649" y="151">01</text><text x="649" y="182">02</text><text x="649" y="213">03</text><text x="649" y="244">04</text><text x="649" y="275">05</text><text x="649" y="306">06</text><text x="649" y="337">07</text></g>
          <text x="670" y="151" fill="#c792ea">const <tspan fill="#82d9ce">developer</tspan> <tspan fill="#e6edf7">= {</tspan></text>
          <text x="670" y="182" fill="#e6edf7">  name: <tspan fill="#a8dc76">"Hussain"</tspan>,</text>
          <text x="670" y="213" fill="#e6edf7">  focus: [<tspan fill="#a8dc76">"web"</tspan>, <tspan fill="#a8dc76">"WordPress"</tspan>],</text>
          <text x="670" y="244" fill="#e6edf7">  learning: [<tspan fill="#a8dc76">"React"</tspan>, <tspan fill="#a8dc76">"Node.js"</tspan>],</text>
          <text x="670" y="275" fill="#e6edf7">  mindset: <tspan fill="#a8dc76">"build in public"</tspan></text>
          <text x="670" y="306" fill="#e6edf7">};</text>
          <text x="670" y="337" fill="#7d91ad">// making the next idea real<tspan class="blink" fill="#76e4c3">▌</tspan></text>
        </g>
      </g>
    </g>
    <text x="1140" y="397" text-anchor="end" fill="#71809a" font-size="11" letter-spacing="2">DESIGN · CODE · ITERATE</text>
  </g>
</svg>
